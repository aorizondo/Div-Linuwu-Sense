# En Debian el driver propietario de NVIDIA se instala como nvidia-current.ko
# y modprobe lo indexa con ese nombre, aunque internamente se registre como
# "nvidia" (de ahi /sys/module/nvidia/). Lo mismo con nvidia-current-drm.
#
# Consecuencia: las lineas "options nvidia ..." y "options nvidia-drm ..." que
# escriben herramientas como envycontrol NO SE APLICAN NUNCA en Debian. Aqui se
# duplican con el nombre correcto. El prefijo zz hace que ganen, y al ser un
# fichero aparte, volver a ejecutar envycontrol no se lleva por delante el
# arreglo.

options nvidia-current NVreg_UsePageAttributeTable=1 NVreg_InitializeSystemMemoryAllocations=0

# RTD3 fine-grained: permite que la GPU se suspenda sola cuando nada la usa. En
# Turing hay que pedirlo explicitamente, porque el valor por defecto (0x03) lo
# DESACTIVA en todo lo anterior a Ampere.
options nvidia-current NVreg_DynamicPowerManagement=0x02

# --------------------------------------------------------------------------
#  No cargar el driver en el arranque
# --------------------------------------------------------------------------
# La dGPU solo se enciende cuando se pide (acer-powersave gpu on), asi que el
# driver no tiene por que cargarse solo. Cargarlo cuesta de dos maneras:
#
#   - El Xorg del gestor de sesion abre /dev/nvidia0 nada mas arrancar y no lo
#     suelta, con lo que la tarjeta no se puede sacar del bus en toda la
#     sesion.
#   - Con el driver cargado la tarjeta llega como mucho a D3cold (10423 mW
#     medidos); fuera del bus el consumo baja a 9905 mW.
#
# "blacklist" solo impide la carga AUTOMATICA por alias, que es la que dispara
# udev al enumerar el dispositivo PCI. Un "modprobe nvidia-current-drm" por
# nombre explicito -lo que hace gpu_on()- sigue funcionando, y por eso este
# ajuste no estorba al encendido en caliente. Usar "install ... /bin/false" si
# lo impediria, y por eso no se usa.
blacklist nvidia-current
blacklist nvidia-current-drm
blacklist nvidia-current-modeset
blacklist nvidia-current-uvm
blacklist i2c-nvidia-gpu

# Ojo: este fichero tiene que llegar al initramfs, o no sirve de nada. El
# driver se carga ahi, antes de que se monte la raiz, y el initramfs lleva una
# copia congelada de /etc/modprobe.d. El postinst del paquete se encarga de
# ejecutar update-initramfs.
