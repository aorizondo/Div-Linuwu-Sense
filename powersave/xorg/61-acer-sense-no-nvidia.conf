# Evita que Xorg enumere la GPU dedicada y la retenga abierta.
#
# En modo hibrido, el Xorg del gestor de sesion (SDDM) abre /dev/nvidia al
# arrancar y no lo suelta mientras dure la sesion, de modo que la tarjeta no se
# puede apagar: "acer-powersave gpu off" se niega, con razon, porque hay un
# proceso usandola.
#
# Esto afecta SOLO a Xorg. La sesion de escritorio es Wayland y KWin enumera
# las GPU por su cuenta, asi que el HDMI de la NVIDIA sigue disponible. Si se
# usa una sesion X11, habra que quitar este fichero.
Section "ServerFlags"
    Option "AutoAddGPU" "off"
EndSection
