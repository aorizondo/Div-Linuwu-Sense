# Ajustes que aplica acer-powersave para cada perfil de power-profiles-daemon.
#
# El perfil activo de PPD es la unica fuente de verdad: no hay fichero de
# estado. En KDE, PowerDevil ya traduce AC/bateria a perfil, de modo que esto
# sigue al enchufado y desenchufado y ademas respeta el cambio manual.
#
# Valores medidos en un Predator PH315-53 (i7-10750H, RTX 2060):
#   - bajar el panel de 144 a 60 Hz ahorra unos 400 mW  (lo aplica la parte
#     de sesion, no este fichero)
#   - fijar la CPU a 800 MHz NO ahorra: multiplica por 3,3 la energia
#     necesaria para el mismo trabajo, porque tarda 3,25 veces mas
#   - ASPM, Ethernet, Bluetooth y Wi-Fi: sin efecto medible

[general]
# "auto" devuelve scaling_min/max_freq al rango completo del hardware en cada
# cambio de perfil. Se define por perfil con la clave "frecuencia"; dejarlo en
# auto evita que queden clavados por otra herramienta.
# Dispositivos USB que no deben autosuspenderse. El raton da tirones al
# moverlo si se le aplica autosuspend.
excluir_usb = 1-3

[ventiladores]
# Por debajo de esta temperatura los ventiladores paran del todo.
temp_minima = 40
# Pares  hasta_grados:porcentaje
curva = 50:20,60:35,70:55,80:75,99:100
# Grados de margen para bajar de escalon, evita que oscile.
histeresis = 3

# ---------------------------------------------------------------------------

# OJO con dos nombres que se parecen y no son lo mismo:
#
#   cpu_turbo  -> Intel Turbo Boost (intel_pstate/no_turbo). Es lo que se
#                 configura aqui.
#   boton Turbo -> el boton fisico con LED del Predator. Lo gestiona el propio
#                 modulo linuwu_sense: enciende el LED, pone los ventiladores
#                 al maximo y sube el overclock. Este servicio NO lo toca.
#
# Por eso "fan" viene como "keep": si el servicio escribiese fan_speed en cada
# cambio de perfil, cancelaria el modo turbo de los ventiladores en cuanto
# cambiara el perfil (por ejemplo al desenchufar). El estado del LED de turbo
# no se puede consultar desde el sysfs, asi que la unica forma de respetarlo es
# no tocar los ventiladores por nuestra cuenta. Para gobernarlos de forma
# explicita esta "acer-powersave fan".

[power-saver]
# Con intel_pstate en modo activo el governor se queda en powersave y quien
# manda de verdad es el EPP.
governor = powersave
epp = power
cpu_turbo = off
dgpu = off
ethernet = off
fan = keep
runtime_pm = yes
audio_powersave = 1

[balanced]
governor = powersave
epp = balance_power
cpu_turbo = on
dgpu = off
ethernet = off
fan = keep
runtime_pm = yes
audio_powersave = 1

[performance]
governor = powersave
epp = balance_performance
cpu_turbo = on
# No se enciende la dGPU sola al pasar a performance: hacerlo cuesta varios
# vatios y casi nunca es lo que se quiere. Usa "acer-powersave gpu on".
dgpu = keep
ethernet = on
fan = keep
runtime_pm = yes
audio_powersave = 1
