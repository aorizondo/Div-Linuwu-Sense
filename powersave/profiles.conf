# Ajustes que aplica acer-powersave para cada perfil de power-profiles-daemon.
#
# El perfil activo de PPD es la unica fuente de verdad: no hay fichero de
# estado. En KDE, PowerDevil ya traduce AC/bateria a perfil, de modo que esto
# sigue al enchufado y desenchufado y ademas respeta el cambio manual.
#
# Valores medidos en un Predator PH315-53 (i7-10750H, RTX 2060):
#   - bajar el panel de 144 a 60 Hz ahorra unos 400 mW  (lo aplica la parte
#     de sesion, no este fichero)
#   - fijar la CPU a 800 MHz NO ahorra: multiplica por 3,3 la energia
#     necesaria para el mismo trabajo, porque tarda 3,25 veces mas
#   - ASPM, Ethernet, Bluetooth y Wi-Fi: sin efecto medible

[general]
# Dispositivos USB que no deben autosuspenderse. El raton da tirones al
# moverlo si se le aplica autosuspend.
excluir_usb = 1-3

[ventiladores]
# Por debajo de esta temperatura los ventiladores paran del todo.
temp_minima = 40
# Pares  hasta_grados:porcentaje
curva = 50:20,60:35,70:55,80:75,99:100
# Grados de margen para bajar de escalon, evita que oscile.
histeresis = 3

# ---------------------------------------------------------------------------

[power-saver]
# Con intel_pstate en modo activo el governor se queda en powersave y quien
# manda de verdad es el EPP.
governor = powersave
epp = power
turbo = off
dgpu = off
ethernet = off
fan = 0
runtime_pm = yes
audio_powersave = 1

[balanced]
governor = powersave
epp = balance_power
turbo = on
dgpu = off
ethernet = off
fan = auto
runtime_pm = yes
audio_powersave = 1

[performance]
governor = powersave
epp = balance_performance
turbo = on
# No se enciende la dGPU sola al pasar a performance: hacerlo cuesta varios
# vatios y casi nunca es lo que se quiere. Usa "acer-powersave gpu on".
dgpu = keep
ethernet = on
fan = auto
runtime_pm = yes
audio_powersave = 1
