# Settings acer-powersave applies for each power-profiles-daemon profile.
#
# The active PPD profile is the single source of truth: there is no state file
# of our own. Under KDE, PowerDevil already maps AC and battery to a profile,
# so this follows the mains cable and still honours a manual override.
#
# Measured on a Predator PH315-53 (i7-10750H, RTX 2060):
#   - dropping the panel from 144 to 60 Hz saves about 400 mW (applied by the
#     session part, not by this file)
#   - pinning the CPU to 800 MHz does NOT save anything: it multiplies by 3.3
#     the energy needed for the same work, because it takes 3.25x longer
#   - ASPM, Ethernet, Bluetooth and Wi-Fi: no measurable effect

[general]
# Stop charging at this percentage, from 80 to 100. Left empty, the charge
# limit is not touched.
#
# The firmware only knows two states: battery health mode on, which cuts the
# charge around 80%, and off, which charges to the top. Anything in between is
# done by the driver, which watches the capacity and turns health mode on when
# the limit is reached. Note that with health mode on the battery settles at
# 78-79%, never at a clean 80.
#
# The driver does not remember this across reboots -- on load it can only tell
# 80 from 100, which is all the firmware keeps -- so the service writes it back
# at start-up. It also works the other way round: the service watches the
# attribute and records here whatever the graphical interface or a plain echo
# sets, so this key rarely needs editing by hand. Doing so takes effect on the
# next restart; to apply it right away use "acer-powersave charge-limit N".
charge_limit =

# USB devices that must not be autosuspended. A mouse stutters when moved if
# autosuspend is applied to it.
exclude_usb = 1-3

[fans]
# Below this temperature the fans stop completely.
min_temp = 40
# Pairs of  up_to_degrees:percentage
curve = 50:20,60:35,70:55,80:75,99:100
# Degrees of margin before stepping down, so it does not oscillate.
hysteresis = 3

# ---------------------------------------------------------------------------
#  Per-profile keys
# ---------------------------------------------------------------------------
#
# unpin_cpu_freq (default: yes)
#   power-profiles-daemon implements power-saver by pinning scaling_max_freq to
#   the hardware minimum, on top of setting the EPP. On this machine that
#   backfires: the same task takes 3.25x longer and burns 3.3x more energy,
#   because the CPU cannot race to idle. With "yes" the service undoes that cap
#   and lets the EPP do its job. Set it to "no" if you really want a hard cap.
#
#   PPD cannot be configured to skip this. It has no config file for it, its
#   --block-driver option removes the CPU driver altogether (and with it the
#   performance profile), and platform_profile is rejected by this firmware.
#   Undoing the cap afterwards is the least invasive option left.
#
# Two names that look alike and are not the same thing:
#
#   cpu_turbo   -> Intel Turbo Boost (intel_pstate/no_turbo). This is what you
#                  configure here.
#   Turbo button -> the physical button with the LED on the Predator. The
#                  linuwu_sense module handles it on its own: it lights the
#                  LED, puts the fans at maximum and raises the overclock.
#                  This service does NOT touch it.
#
# That is why "fan" defaults to "keep": if the service wrote fan_speed on every
# profile change, it would cancel the fans' turbo mode as soon as the profile
# changed (on unplugging, for instance). The turbo LED state cannot be read
# back from sysfs, so the only way to respect it is to leave the fans alone.
# To drive them explicitly there is "acer-powersave fan".

[power-saver]
unpin_cpu_freq = yes
# With intel_pstate in active mode the governor stays at powersave and the EPP
# is what actually decides.
governor = powersave
epp = power
cpu_turbo = off
dgpu = off
ethernet = off
fan = keep
runtime_pm = yes
audio_powersave = 1

[balanced]
governor = powersave
epp = balance_power
cpu_turbo = on
dgpu = off
ethernet = off
fan = keep
runtime_pm = yes
audio_powersave = 1

[performance]
governor = powersave
epp = balance_performance
cpu_turbo = on
# The dGPU is not powered up automatically when switching to performance:
# doing so costs several watts and is rarely what you want. Use
# "acer-powersave gpu on".
dgpu = keep
ethernet = on
fan = keep
runtime_pm = yes
audio_powersave = 1
