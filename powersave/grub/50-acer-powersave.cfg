# Parametros de arranque recomendados para Acer Predator/Nitro.
#
# grub-mkconfig sourcea los ficheros de /etc/default/grub.d/ despues de
# /etc/default/grub, asi que este fragmento ajusta la variable sin tocar el
# fichero del usuario. Desinstalar el paquete lo revierte por completo.

# intel_pstate=passive deja el governor generico "powersave" clavado en la
# frecuencia minima, incluso con carga: el EPP queda inoperante y cualquier
# trabajo consume 3,3 veces mas energia porque tarda 3,25 veces mas. En modo
# activo el EPP funciona y la CPU escala.
#
# pci_aspm=force no existe: el parametro correcto es pcie_aspm=force. Se
# elimina por ruido; el valido se conserva.
GRUB_CMDLINE_LINUX_DEFAULT="$(printf '%s' "$GRUB_CMDLINE_LINUX_DEFAULT" \
    | sed -e 's/[[:space:]]*\bintel_pstate=passive\b//g' \
          -e 's/[[:space:]]*\bpci_aspm=force\b//g')"

for _acer_p in pcie_aspm=force i915.enable_fbc=1 i915.enable_dc=2; do
    case " $GRUB_CMDLINE_LINUX_DEFAULT " in
        *" $_acer_p "*) ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT $_acer_p" ;;
    esac
done
unset _acer_p

# No se toca processor.max_cstate: puede limitar los estados de reposo
# profundos del paquete, pero quitarlo es decision del usuario (a veces se
# pone a proposito para sortear inestabilidad del firmware).
