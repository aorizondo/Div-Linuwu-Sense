<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icono de Acer Sense.

  Un disipador visto de frente: las aletas verticales y, sobre ellas, el arco
  de un medidor con su aguja, que es el elemento que mas identifica a la propia
  aplicacion (los medidores circulares de la pagina de monitorizacion). El cian
  es el acento de la interfaz, y el mismo que usa Predator.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232931"/>
      <stop offset="1" stop-color="#14181d"/>
    </linearGradient>
    <linearGradient id="arco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c8d7"/>
      <stop offset="1" stop-color="#4de3ee"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#fondo)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="12.25"
        fill="none" stroke="#2f3a44" stroke-width="1.5"/>

  <!-- aletas del disipador -->
  <g fill="#3c4854">
    <rect x="15" y="34" width="4" height="17" rx="1.6"/>
    <rect x="23" y="34" width="4" height="17" rx="1.6"/>
    <rect x="31" y="34" width="4" height="17" rx="1.6"/>
    <rect x="39" y="34" width="4" height="17" rx="1.6"/>
    <rect x="47" y="34" width="4" height="17" rx="1.6"/>
  </g>
  <rect x="13" y="30.5" width="40" height="4" rx="2" fill="#4a5867"/>

  <!-- arco del medidor: 270 grados, con el hueco abajo, como en la app -->
  <path d="M 14 30 A 18 18 0 1 1 50 30"
        fill="none" stroke="#2f3a44" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 14 30 A 18 18 0 0 1 32 12"
        fill="none" stroke="url(#arco)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M 32 12 A 18 18 0 0 1 45.5 18.5"
        fill="none" stroke="url(#arco)" stroke-width="5.5" stroke-linecap="round"
        opacity="0.55"/>

  <!-- aguja -->
  <line x1="32" y1="30" x2="24" y2="19.5"
        stroke="#e6edf3" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="32" cy="30" r="3.6" fill="#14181d" stroke="#00c8d7" stroke-width="2.2"/>
</svg>
