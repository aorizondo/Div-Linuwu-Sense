# linuwu_sense sustituye al driver acer_wmi del kernel: ambos enlazan con los
# mismos GUID de ACPI-WMI y no deben cargarse a la vez.
#
# "blacklist" por si solo no impide que el kernel autocargue el modulo, asi que
# hace falta ademas la linea "install".
#
# Este fichero vive en /usr/lib y no en /etc a proposito: no es un conffile, se
# elimina limpiamente al desinstalar el paquete (devolviendo acer_wmi) y puede
# anularse sin tocar el paquete creando /etc/modprobe.d/zz-local-acer-wmi.conf
# con:  install acer_wmi /sbin/modprobe --ignore-install acer_wmi
blacklist acer_wmi
install acer_wmi /bin/true

# NO activar enable_all aqui. Enciende TODAS las capacidades a la vez, incluida
# ACER_CAP_NITRO_SENSE_V4, y entonces la condicion de linuwu_sense.c que crea
# predator_sense/ (PREDATOR_SENSE && !NITRO_SENSE_V4) deja de cumplirse: un
# Predator acaba con el directorio nitro_sense/ en su lugar.
#
# Solo tiene sentido en modelos cuyo quirk DMI esta incompleto, y entonces
# conviene ponerlo a mano en /etc/modprobe.d/, no para todo el mundo:
#   options linuwu_sense enable_all=1
